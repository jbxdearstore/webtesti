<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Testimoni</title>
<meta name="theme-color" content="#FBF3E4">
<style>
:root{--bg:#FBF3E4;--surface:#FFFDF8;--text:#2B2118;--muted:#7A6A58;--line:#EADBC2;--accent:#E8590C;--on-accent:#fff;--font:'Poppins',sans-serif}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

/* HERO */
.hero{text-align:center;padding:56px 0 28px}
.logo{width:76px;height:76px;border-radius:50%;object-fit:cover;margin:0 auto 14px;display:block;border:3px solid var(--surface);box-shadow:0 4px 14px rgba(0,0,0,.14)}
h1{font-size:clamp(26px,6vw,42px);line-height:1.2;font-weight:800;letter-spacing:-.02em}
.desc{color:var(--muted);max-width:560px;margin:12px auto 0}
.stats{display:flex;justify-content:center;gap:10px;margin:22px 0 4px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 18px;font-weight:600;font-size:14px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:999px;padding:12px 24px;font:600 15px var(--font);text-decoration:none;cursor:pointer;margin-top:18px}
.btn:active{transform:scale(.97)}
.wa-float{position:fixed;right:16px;bottom:16px;z-index:20;margin:0;box-shadow:0 8px 22px rgba(0,0,0,.25)}

/* DAFTAR TESTIMONI */
#list{padding:20px 0 40px}
#list[data-susunan=grid]{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
#list[data-susunan=masonry]{column-width:250px;column-gap:18px}
#list[data-susunan=masonry] .card{break-inside:avoid;margin-bottom:18px}
#list[data-susunan=slider]{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 4px 22px}
#list[data-susunan=slider] .card{flex:0 0 280px;scroll-snap-align:start}

.card{background:var(--surface);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
body[data-kartu=bulat] .card{border-radius:20px;box-shadow:0 6px 20px rgba(0,0,0,.06)}
body[data-kartu=kotak] .card{border-radius:4px}
body[data-kartu=polaroid] .card{border-radius:4px;padding:12px 12px 6px;box-shadow:0 8px 22px rgba(0,0,0,.15);transform:rotate(-1.2deg);transition:transform .2s}
body[data-kartu=polaroid] .card:nth-child(even){transform:rotate(1.2deg)}
body[data-kartu=polaroid] .card:hover{transform:rotate(0)}
body[data-kartu=polaroid] .body{padding:12px 4px 10px}

/* gaya khusus tema Pop */
body[data-tema=pop] .card{border:2px solid var(--line);box-shadow:5px 5px 0 var(--line)}
body[data-tema=pop] .stat,body[data-tema=pop] .btn{border:2px solid var(--line)}
body[data-tema=pop] .btn{box-shadow:3px 3px 0 var(--line)}

.media{position:relative;cursor:pointer;background:var(--line);overflow:hidden}
.media img,.media video{width:100%;display:block}
.media:not(.vid) img{height:auto;max-height:380px;object-fit:cover;object-position:top}
.media.vid{aspect-ratio:16/9;background:#000}
.media.vid img,.media.vid video{height:100%;object-fit:cover}
.play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:22px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.play::before{content:'';position:absolute;width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.55);z-index:-1}

.body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.stars{color:#F5A524;letter-spacing:2px;font-size:15px}
.text{white-space:pre-line;font-size:15px}
.who{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:auto;padding-top:6px}
.name{font-weight:700;font-size:14px}
.tag{color:var(--accent);font-weight:600;font-size:12px}
.date{color:var(--muted);font-size:12px;white-space:nowrap}

.state{text-align:center;color:var(--muted);padding:60px 0}
footer{text-align:center;color:var(--muted);font-size:13px;padding:24px 16px 90px}

/* LIGHTBOX */
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;place-items:center;z-index:50;padding:16px}
#lb.open{display:grid}
#lb .box{width:100%;max-width:min(92vw,900px);max-height:88vh}
#lb img{max-width:100%;max-height:88vh;display:block;margin:auto;border-radius:10px}
#lb iframe,#lb video{width:100%;aspect-ratio:16/9;max-height:88vh;border:0;border-radius:10px;background:#000}
#lb .x{position:absolute;top:10px;right:16px;color:#fff;font-size:34px;line-height:1;background:none;border:0;cursor:pointer}
</style>
</head>
<body data-tema="wall" data-kartu="bulat">
<main class="wrap">
  <header class="hero" id="hero" hidden>
    <img id="logo" class="logo" alt="" hidden>
    <h1 id="title">Testimoni</h1>
    <p id="desc" class="desc" hidden></p>
    <div id="stats" class="stats"></div>
    <a id="wabtn" class="btn" target="_blank" rel="noopener" hidden>Chat WhatsApp</a>
  </header>
  <section id="list" data-susunan="grid"></section>
  <p id="state" class="state">Memuat testimoni…</p>
</main>
<footer>&copy; <span id="yr"></span> <span id="fbrand"></span> &middot; <a href="privacy.html" style="color:inherit">Kebijakan Privasi</a></footer>
<a id="wafloat" class="btn wa-float" target="_blank" rel="noopener" hidden>Chat WhatsApp</a>
<div id="lb"><button class="x" aria-label="Tutup">&times;</button><div class="box" id="lbbox"></div></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
